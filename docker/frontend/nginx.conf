server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_read_timeout 900s;
    proxy_set_header Host $host;
  }
  location ~* \.(js|css)$ { try_files $uri =404; add_header Cache-Control "no-cache"; }
  location / { try_files $uri /index.html; }   # history-API routes (/agentes/..., /actividad, ...)
}
