server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  resolver 127.0.0.11 valid=5s;       # Docker DNS: re-resolve so a recreated backend is found again
  location /api/ {
    set $upstream http://pims-backend:8000;
    proxy_pass $upstream;
    proxy_read_timeout 900s;
    proxy_set_header Host $host;
  }
  location ~* \.(js|css)$ { try_files $uri =404; add_header Cache-Control "no-cache"; }
  location / { try_files $uri /index.html; }   # history-API routes (/agentes/..., /actividad, ...)
}
