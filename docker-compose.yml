# Default run (laptop, no Ollama):  docker compose up --build -d
# Other computer with Ollama:        docker compose --profile ollama up --build -d
# Only the frontend publishes a port. Agent services are added in Step 7.

x-llm-env: &llm-env
  LLM_MODE: ${LLM_MODE:-cloud}
  LLM_API_KEY: ${LLM_API_KEY:-}                 # shared key: only used when LLM_ALLOW_SHARED_FALLBACK=true
  LLM_ALLOW_SHARED_FALLBACK: ${LLM_ALLOW_SHARED_FALLBACK:-false}
  # One Gemini key (and optional model) PER TEAM, so no team saturates another team's quota
  LLM_API_KEY_G1: ${LLM_API_KEY_G1:-}
  LLM_API_KEY_G2: ${LLM_API_KEY_G2:-}
  LLM_API_KEY_G3: ${LLM_API_KEY_G3:-}
  LLM_API_KEY_G4: ${LLM_API_KEY_G4:-}
  LLM_API_KEY_G5: ${LLM_API_KEY_G5:-}
  LLM_API_KEY_G6: ${LLM_API_KEY_G6:-}
  LLM_API_KEY_G7: ${LLM_API_KEY_G7:-}
  LLM_API_KEY_G8: ${LLM_API_KEY_G8:-}
  LLM_MODEL_G1: ${LLM_MODEL_G1:-}
  LLM_MODEL_G2: ${LLM_MODEL_G2:-}
  LLM_MODEL_G4: ${LLM_MODEL_G4:-}
  LLM_MODEL_G5: ${LLM_MODEL_G5:-}
  LLM_MODEL_G7: ${LLM_MODEL_G7:-}
  LLM_MODEL_G8: ${LLM_MODEL_G8:-}
  LLM_BASE_URL: ${LLM_BASE_URL-https://generativelanguage.googleapis.com/v1beta/openai}
  LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash-lite}
  LLM_EMBED_MODEL: ${LLM_EMBED_MODEL:-gemini-embedding-001}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
  LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-4}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gestitel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gestitel_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-gestitel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  db-init:
    image: postgres:17-alpine
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gestitel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gestitel_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-gestitel}
      ORCHESTRATOR_DB_PASSWORD: ${ORCHESTRATOR_DB_PASSWORD:-orch_dev_pw}
      AGENTE7_DB_PASSWORD: ${AGENTE7_DB_PASSWORD:-agente7_dev_pw}
      AGENTE7_RO_PASSWORD: ${AGENTE7_RO_PASSWORD:-agente7ro_dev_pw}
    volumes:
      - ./database:/database:ro
      - ./agents/Agente_terceros_dpa-Grupo5/bd:/g5bd:ro
      - ./docker/scripts/db-init.sh:/db-init.sh:ro
    entrypoint: ["sh", "/db-init.sh"]
    networks: [internal]

  llm-gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    restart: unless-stopped
    environment: *llm-env
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db-init: {condition: service_completed_successfully}
      llm-gateway: {condition: service_healthy}
    environment:
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-gestitel}
      DB_USER: orchestrator_rw
      DB_PASSWORD: ${ORCHESTRATOR_DB_PASSWORD:-orch_dev_pw}
      GATEWAY_URL: http://llm-gateway:8080
      QDRANT_API_KEY: ${QDRANT_API_KEY:-qdrant_dev_key}
      HUMAN_BRIDGE_TOKEN: ${HUMAN_BRIDGE_TOKEN:-bridge_dev_token}
      # Demo accounts for the human-review page: user:password:role;... (change them in .env)
      HUMAN_USERS: ${HUMAN_USERS:-dpo:demo-dpo:DPO;legal:demo-legal:Legal}
      HUMAN_SECRET: ${HUMAN_SECRET:-}
      # Agent base URLs (services added in Step 7); an unreachable agent is reported as "caido".
      AGENT_G1_URL: http://agent-g1:8000
      AGENT_G2_URL: http://agent-g2:4318
      AGENT_G3_URL: http://agent-g3:8001/mcp
      AGENT_G4_URL: http://agent-g4:8004
      AGENT_G5_URL: http://agent-g5:5678
      AGENT_G6_URL: http://agent-g6:8006
      AGENT_G7_URL: http://agent-g7:5007
      AGENT_G8_URL: http://agent-g8:3100
    networks:
      internal:
        aliases: [pims-backend]      # unique name: shared networks (Traefik) may host other projects' "backend"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
    ports:
      - "${FRONTEND_PORT:-8080}:80"      # the only published port
    networks: [internal]

  # ---------------- Agents (one container each; originals untouched, config by env only) ----------------
  agent-g1:
    build:
      context: ./agents/Agente_formacion_conciencia-Grupo1
      dockerfile: ../../docker/agents/g1.Dockerfile
    restart: unless-stopped
    environment:
      LLM_PROVIDER: ollama                       # agent's own switch; its "ollama" branch speaks to the gateway
      OLLAMA_HOST: http://llm-gateway:8080/g1
      OLLAMA_MODEL: ${LLM_MODEL:-gemini-3.5-flash-lite}
      OLLAMA_EMBED_MODEL: ${LLM_EMBED_MODEL:-gemini-embedding-001}
      DB_PATH: /data/agente.db
      CHROMA_PATH: /data/chroma_db
      EVIDENCIAS_PATH: /data/evidencias
    # The agent seeds its own SQLite with init_db.py (its documented setup step); only when the users table is empty.
    command: ["sh", "-c", "python -c \"import sqlite3,sys;sys.exit(0 if sqlite3.connect('/data/agente.db').execute('select count(*) from usuarios').fetchone()[0] else 1)\" 2>/dev/null || python init_db.py; exec uvicorn main:app --host 0.0.0.0 --port 8000"]
    volumes: [g1data:/data]
    depends_on: {llm-gateway: {condition: service_healthy}}
    networks: [internal]

  agent-g3:
    build:
      context: ./agents/Agente_derechos_dsar-Grupo3
      dockerfile: ../../docker/agents/g3.Dockerfile
      additional_contexts: {wrap: ./docker/agents}
    restart: unless-stopped
    environment:
      DSAR_DB_PATH: /data/dsar.sqlite3
      DSAR_HANDOFF_DIR: /data/handoffs
      DSAR_EXPORT_DIR: /data/exports
      HUMAN_BRIDGE_TOKEN: ${HUMAN_BRIDGE_TOKEN:-bridge_dev_token}
    volumes: [g3data:/data]
    networks: [internal]

  agent-g4:
    build:
      context: ./agents/Agente_evidencia_auditoria-Grupo4
      dockerfile: ../../docker/agents/g4.Dockerfile
    restart: unless-stopped
    networks: [internal]

  agent-g6:
    build:
      context: ./agents/Agente_inventario_datos-Grupo6
      dockerfile: ../../docker/agents/g6.Dockerfile
    restart: unless-stopped
    environment:
      INVENTARIO_DB_PATH: /data/inventario.sqlite3     # its own SQLite, in a volume; rule-based engine, no model
    volumes: [g6data:/data]
    networks: [internal]

  agent-g7:
    build:
      context: ./agents/Agente_controles_soa-Grupo7
      dockerfile: ../../docker/agents/g7.Dockerfile
    restart: unless-stopped
    environment:
      OLLAMA_URL: http://llm-gateway:8080/g7
      OLLAMA_MODEL: ${LLM_MODEL:-gemini-3.5-flash-lite}
      OLLAMA_EMBED_MODEL: ${LLM_EMBED_MODEL:-gemini-embedding-001}
      OLLAMA_TIMEOUT: ${LLM_TIMEOUT_SECONDS:-120}
    depends_on: {llm-gateway: {condition: service_healthy}}
    networks: [internal]

  agent-g8:
    build:
      context: ./agents/Agente_incidentes_brechas-Grupo8
      dockerfile: Dockerfile                      # the group's own Dockerfile, unmodified
    restart: unless-stopped
    environment:
      # Its Groq branch speaks OpenAI format; groq-sdk reads GROQ_BASE_URL. No GEMINI/ANTHROPIC key is set,
      # so the agent can only select this gateway-bound provider.
      GROQ_API_KEY: gateway-managed
      GROQ_BASE_URL: http://llm-gateway:8080/g8
      GROQ_MODEL: ${LLM_MODEL:-gemini-3.5-flash-lite}
      HOST: 0.0.0.0
      PORT: "3100"
    volumes:
      - g8salidas:/app/salidas
      - g8buzon:/app/buzon
      - g8contextos:/app/contextos
    depends_on: {llm-gateway: {condition: service_healthy}}
    networks: [internal]

  agent-g5:
    build:
      context: ./agents/Agente_terceros_dpa-Grupo5
      dockerfile: ../../docker/agents/g5.Dockerfile
      additional_contexts: {wrap: ./docker/agents}
    restart: unless-stopped
    environment:
      GATEWAY_V1_URL: http://llm-gateway:8080/g5/v1
      LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash-lite}
      N8N_USER_FOLDER: /n8n-home
      # Gestitel (the group's own supported mode: config_bd.json activo=true + n8n credential "PIMS Postgres")
      G5_DB_HOST: postgres
      G5_DB_NAME: ${POSTGRES_DB:-gestitel}
      G5_DB_USER: agente7
      G5_DB_PASSWORD: ${AGENTE7_DB_PASSWORD:-agente7_dev_pw}
    volumes:
      - g5n8n:/n8n-home
      - g5datos:/app/g5/datos
      - g5orgs:/app/g5/organizaciones
    depends_on: {llm-gateway: {condition: service_healthy}}
    networks: [internal]

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-qdrant_dev_key}
    volumes: [qdrantdata:/qdrant/storage]
    networks: [internal]            # no published port

  agent-g2:
    build:
      context: ./agents/Agente_evaluacion_riesgos-Grupo2
      dockerfile: ../../docker/agents/g2.Dockerfile
      additional_contexts: {wrap: ./docker/agents}
    restart: unless-stopped
    environment:
      GATEWAY_V1_URL: http://llm-gateway:8080/g2/v1
      LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash-lite}
      LLM_EMBED_MODEL: ${LLM_EMBED_MODEL:-gemini-embedding-001}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-qdrant_dev_key}
      # The group's own human review gate. Left false until someone reviews the workflows (see docs).
      SCOPE_N8N_REVIEWED: ${G2_SCOPE_N8N_REVIEWED:-false}
      # Gemini Vision stays disabled: it would bypass the gateway.
      GEMINI_VISION_API_KEY: ""
    volumes:
      - g2n8n:/root/.n8n
    depends_on:
      llm-gateway: {condition: service_healthy}
      qdrant: {condition: service_started}
    networks: [internal]

  # One-shot tool: docker compose --profile tools run --rm -e X=1 ocr   (PDF stays outside the repo, read-only)
  ocr:
    profiles: [tools]
    build:
      context: .
      dockerfile: docker/tools/ocr.Dockerfile
    volumes:
      - ${NORM_PDF_PATH:-./norma-no-configurada.pdf}:/in/norma.pdf:ro
      - ./ocr_output:/out
    networks: [internal]

  # ---- Optional profile: only for the machine that runs Ollama ----
  ollama:
    profiles: [ollama]
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    networks: [internal]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Optional GPU (uncomment on a machine with NVIDIA Container Toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - {driver: nvidia, count: all, capabilities: [gpu]}

  ollama-init:
    profiles: [ollama]
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama: {condition: service_healthy}
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      LLM_EMBED_MODEL: ${LLM_EMBED_MODEL:-nomic-embed-text}
    entrypoint: ["sh", "-c", "ollama pull \"$$LLM_MODEL\" && ollama pull \"$$LLM_EMBED_MODEL\""]
    networks: [internal]

networks:
  internal:
    internal: false
  public: {}

volumes:
  pgdata:
  g1data:
  g6data:
  g2n8n:
  qdrantdata:
  g5n8n:
  g5datos:
  g5orgs:
  g8salidas:
  g8buzon:
  g8contextos:
  g3data:
  ollama:
